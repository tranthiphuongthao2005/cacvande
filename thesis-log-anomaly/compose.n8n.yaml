services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.7
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?configure .env.n8n}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_RUNNERS_GRANT_TOKEN_TTL: "180"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "4"
      N8N_PAYLOAD_SIZE_MAX: "1"
      EXECUTIONS_TIMEOUT: "65"
      EXECUTIONS_TIMEOUT_MAX: "65"
      NODE_OPTIONS: --max-old-space-size=384
    networks: [workflow]
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    mem_limit: 640m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
  incident-adapter:
    build:
      context: .
      dockerfile: services/incident/Dockerfile
    environment:
      WORKFLOW_TRIGGER_TOKEN: "${WORKFLOW_TRIGGER_TOKEN:?configure .env.n8n}"
    networks: [workflow, logging]
    volumes: [incident-data:/data]
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  workflow:
volumes:
  n8n-data:
  incident-data:
