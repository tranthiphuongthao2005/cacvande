services:
  incident-management:
    profiles: [incident-management]
    build:
      context: .
      dockerfile: services/incident-management/Dockerfile
    environment:
      INCIDENT_MANAGEMENT_ENABLED: "${INCIDENT_MANAGEMENT_ENABLED:-false}"
      INCIDENT_HANDOFF_ENABLED: "${INCIDENT_HANDOFF_ENABLED:-false}"
      INCIDENT_STORAGE_PATH: /data/incidents.sqlite
      INCIDENT_SOURCE_STORAGE_PATH: /source/monitoring.sqlite
      INCIDENT_API_TOKEN: "${INCIDENT_API_TOKEN:-}"
      INCIDENT_READ_TOKEN: "${INCIDENT_READ_TOKEN:-}"
      INCIDENT_OPERATOR_ID: "${INCIDENT_OPERATOR_ID:-internal-operator}"
      INCIDENT_POLL_INTERVAL_SECONDS: "${INCIDENT_POLL_INTERVAL_SECONDS:-5}"
      INCIDENT_BATCH_SIZE: "${INCIDENT_BATCH_SIZE:-32}"
      INCIDENT_MAX_RETRIES: "${INCIDENT_MAX_RETRIES:-3}"
      INCIDENT_RETRY_BACKOFF_SECONDS: "${INCIDENT_RETRY_BACKOFF_SECONDS:-5}"
      INCIDENT_MAX_PAGE_SIZE: "${INCIDENT_MAX_PAGE_SIZE:-100}"
      INCIDENT_MAX_PAYLOAD_BYTES: "${INCIDENT_MAX_PAYLOAD_BYTES:-4096}"
    networks: [incident-management]
    ports: ["127.0.0.1:18017:8000"]
    volumes:
      - incident-data:/data
      - monitoring-data:/source
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 150s
volumes:
  incident-data:
  monitoring-data:
networks:
  incident-management:
    internal: true
