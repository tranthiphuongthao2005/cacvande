services:
  monitoring-worker:
    profiles: [monitoring]
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    environment:
      MONITORING_ENABLED: "${MONITORING_ENABLED:-false}"
      MONITORING_DRY_RUN: "${MONITORING_DRY_RUN:-false}"
      MONITORING_ES_URL: "${MONITORING_ES_URL:-http://elasticsearch:9200}"
      MONITORING_ES_API_KEY: "${MONITORING_ES_API_KEY:-}"
      MONITORING_ES_INDEX: "${MONITORING_ES_INDEX:-thesis-logs-*}"
      MONITORING_DETECTION_URL: "${MONITORING_DETECTION_URL:-http://detection-service:8000}"
      MONITORING_STORAGE_PATH: /data/monitoring.sqlite
      MONITORING_START_POLICY: "${MONITORING_START_POLICY:-START_FROM_NOW}"
      MONITORING_LOOKBACK_SECONDS: "${MONITORING_LOOKBACK_SECONDS:-0}"
      MONITORING_OVERLAP_SECONDS: "${MONITORING_OVERLAP_SECONDS:-300}"
      MONITORING_POLL_INTERVAL_SECONDS: "${MONITORING_POLL_INTERVAL_SECONDS:-5}"
      MONITORING_BATCH_SIZE: "${MONITORING_BATCH_SIZE:-128}"
      MONITORING_MAX_PAGES: "${MONITORING_MAX_PAGES:-32}"
      MONITORING_POLL_TIMEOUT_SECONDS: "${MONITORING_POLL_TIMEOUT_SECONDS:-15}"
      MONITORING_QUIET_PERIOD_SECONDS: "${MONITORING_QUIET_PERIOD_SECONDS:-5}"
      MONITORING_MAX_TRACE_WAIT_SECONDS: "${MONITORING_MAX_TRACE_WAIT_SECONDS:-30}"
      MONITORING_MAX_CONCURRENT_TRACES: "${MONITORING_MAX_CONCURRENT_TRACES:-2}"
      MONITORING_DETECTION_TIMEOUT_SECONDS: "${MONITORING_DETECTION_TIMEOUT_SECONDS:-12}"
      MONITORING_MAX_RETRIES: "${MONITORING_MAX_RETRIES:-2}"
      MONITORING_RETRY_BACKOFF_SECONDS: "${MONITORING_RETRY_BACKOFF_SECONDS:-10}"
      MONITORING_TIMEOUT_COOLDOWN_SECONDS: "${MONITORING_TIMEOUT_COOLDOWN_SECONDS:-90}"
      MONITORING_RETENTION_SECONDS: "${MONITORING_RETENTION_SECONDS:-604800}"
    networks: [logging]
    volumes: [monitoring-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 300s
volumes:
  monitoring-data:
networks:
  logging:
