services:
  context-integration:
    profiles: [context-integration]
    build:
      context: .
      dockerfile: services/context-integration/Dockerfile
    environment:
      CONTEXT_INTEGRATION_ENABLED: "${CONTEXT_INTEGRATION_ENABLED:-false}"
      CONTEXT_INTEGRATION_DRY_RUN: "${CONTEXT_INTEGRATION_DRY_RUN:-false}"
      CONTEXT_INTEGRATION_URL: "${CONTEXT_INTEGRATION_URL:-http://context-service:8000}"
      CONTEXT_INTEGRATION_STORAGE_PATH: /data/monitoring.sqlite
      CONTEXT_INTEGRATION_NAMESPACE: "${CONTEXT_INTEGRATION_NAMESPACE:-local}"
      CONTEXT_INTEGRATION_POLL_INTERVAL_SECONDS: "${CONTEXT_INTEGRATION_POLL_INTERVAL_SECONDS:-5}"
      CONTEXT_INTEGRATION_BATCH_SIZE: "${CONTEXT_INTEGRATION_BATCH_SIZE:-16}"
      CONTEXT_INTEGRATION_TIMEOUT_SECONDS: "${CONTEXT_INTEGRATION_TIMEOUT_SECONDS:-12}"
      CONTEXT_INTEGRATION_MAX_RETRIES: "${CONTEXT_INTEGRATION_MAX_RETRIES:-2}"
      CONTEXT_INTEGRATION_RETRY_BACKOFF_SECONDS: "${CONTEXT_INTEGRATION_RETRY_BACKOFF_SECONDS:-10}"
      CONTEXT_INTEGRATION_MAX_CONCURRENCY: "${CONTEXT_INTEGRATION_MAX_CONCURRENCY:-2}"
      CONTEXT_INTEGRATION_RETENTION_SECONDS: "${CONTEXT_INTEGRATION_RETENTION_SECONDS:-604800}"
      CONTEXT_INTEGRATION_MAX_PAYLOAD_BYTES: "${CONTEXT_INTEGRATION_MAX_PAYLOAD_BYTES:-1048576}"
    networks: [logging]
    volumes: [monitoring-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 150s
volumes:
  monitoring-data:
networks:
  logging:
